# Reviewed replacement template for ONLY smartcore-identity-ip-tls.conf, after
# the new bundle passes staging.py check and the loopback gateway is ready.
# Keep the separate port-80 IP ACME vhost unchanged for certificate renewals.
server {
    listen 8443 ssl;
    server_name 87.107.54.244;
    ssl_certificate /etc/letsencrypt/live/smartcore-identity-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartcore-identity-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/smartcore-identity-gateway.error.log crit;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /healthz {
        default_type text/plain;
        return 200 "smartcore-tls-ready\n";
    }
    location ^~ /bff/ {
        # No URI suffix/rewrite: preserve the original URI for exact gateway checks.
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host "87.107.54.244:8443";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-SmartCore-Bff-Gateway-Proof "";
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 50s;
        proxy_send_timeout 50s;
        proxy_buffering off;
    }
    location / { return 404; }
}
