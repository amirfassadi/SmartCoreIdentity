        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/RegistrationConflict409'
        '413':
          $ref: '#/components/responses/TooLargeError'
        '415':
          $ref: '#/components/responses/MediaTypeError'
        '429':
          $ref: '#/components/responses/RegistrationRate429'
        '503':
