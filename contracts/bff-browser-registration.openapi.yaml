        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/RouterFallback'
        '200':
          description: Explicit private registration result. Never sets an authentication
            session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
