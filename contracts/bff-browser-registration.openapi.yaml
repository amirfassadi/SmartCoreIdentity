components:
  securitySchemes:
    registrationCookie:
      type: apiKey
      in: cookie
      name: __Host-smartcore-registration
      description: Data Protection authenticated/encrypted proof context. Secure,
        HttpOnly, SameSite=Lax, Path=/, no Domain. Absolute upstream proof expiry,
        at most 11 minutes from issuance; no sliding lifetime. Not a login session.
        Reload loses memory flowId and requires restarting.
  headers:
    RegistrationRetryAfter:
      description: Required decimal seconds equal body. Fixed-window transport 60
        seconds; contact limit 3600 seconds. No automatic command retry.
      x-required: true
      schema:
        type: string
        pattern: ^(?:[1-9][0-9]{0,2}|[12][0-9]{3}|3[0-5][0-9]{2}|3600)$
  schemas:
    RegistrationStartRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - flowId
      - displayName
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        mobile:
          type: string
          minLength: 7
          maxLength: 32
          pattern: ^[+0-9۰-۹٠-٩ ()-]+$
          description: 'Iran default normalization: trim approved separators, normalize
            Persian/Arabic digits; accept +98/0098/09 then canonical E.164 before
            Identity and budgets. Password unchanged.'
        password:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: Unmodified password. Identity login accepts 1..128 UTF-16 code
            units (registration accepts 15..128); JSON Schema maxLength also bounds
            Unicode code points. Host must enforce the UTF-16 limit, including supplementary
            characters.
          x-max-utf16-code-units: 128
        flowId: &id001
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32 random bytes generated by Web Crypto; per-tab correlation
            and explicit retry key only. Not Identity authority; memory only.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
      oneOf:
      - required:
        - email
        not:
          required:
          - mobile
      - required:
        - mobile
        not:
          required:
          - email
    RegistrationFlowRequest:
      type: object
      additionalProperties: false
      required:
      - flowId
      properties:
        flowId: *id001
    RegistrationProofRequest:
      type: object
      additionalProperties: false
      required:
      - flowId
      - code
      properties:
        flowId: *id001
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
    RegistrationCompleteRequest:
      type: object
      additionalProperties: false
      required:
      - flowId
      - code
      - newPassword
      properties:
        flowId:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32 random bytes generated by Web Crypto; per-tab correlation
            and explicit retry key only. Not Identity authority; memory only.
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
    RegistrationPending:
      type: object
      additionalProperties: false
      required:
      - status
      - expiresAt
      - resendAfterSeconds
      properties:
        status:
          type: string
          const: AwaitingVerification
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          const: 60
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required:
      - status
      - resendAfterSeconds
      properties:
        status:
          type: string
          const: Accepted
        resendAfterSeconds:
          type: integer
          const: 60
    RegistrationSetupPending:
      type: object
      additionalProperties: false
      required:
      - status
      - expiresAt
      properties:
        status:
          type: string
          const: AwaitingSetup
        expiresAt:
          type: string
          format: date-time
    RegistrationVerified:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PendingCredential
          - Ready
          - SetupRequired
          - SignInRequired
    RegistrationCompleted:
      type: object
      additionalProperties: false
      required:
      - status
      - credentialOutcome
      properties:
        status:
          type: string
          enum:
          - PendingCredential
          - Ready
        credentialOutcome:
          type: string
          enum:
          - CandidateSelected
          - ExistingWinner
          - Undetermined
      allOf:
      - if:
          properties:
            status:
              const: Ready
        then:
          properties:
            credentialOutcome:
              enum:
              - CandidateSelected
              - ExistingWinner
    RegistrationValidationError:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - VERIFICATION_FAILED
          - REGISTRATION_FLOW_EXPIRED
    RegistrationConflictError:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - IDEMPOTENCY_CONFLICT
          - SESSION_ALREADY_ACTIVE
    RegistrationRateError:
      type: object
      additionalProperties: false
      required:
      - code
      - retryAfterSeconds
      properties:
        code:
          type: string
          const: RATE_LIMITED
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 3600
  responses:
    RegistrationValidation400:
      description: Invalid DTO, proof, expired or mismatched browser flow; no cookie
        mutation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationValidationError'
          examples: {}
    RegistrationConflict409:
      description: Explicit retry conflicts or active authenticated session; preserve
        cookies.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationConflictError'
          examples: {}
    RegistrationRate429:
      description: Exact upstream window; never clamp a contact-hour budget to one
        minute.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RegistrationRetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationRateError'
          examples: {}
