openapi: 3.1.0
info:
  title: SmartCore browser BFF — private B1+B2 candidate
  version: 0.2.0
  description: Additive extension composed by tools/bff_browser_contract.py with bff-browser.openapi.yaml.
    B1 routes/components unchanged. Not production approval.
x-extends: bff-browser.openapi.yaml
paths:
  /bff/register:
    post:
      operationId: browserRegistrationStart
      x-enabled-setting: Bff:RegistrationEnabled
      description: Disabled routes return router 404. Explicit opt-in in Development/Testing
        only. Same ordered B1 transport/CSRF guards; anonymous only. No automatic
        replay. Each tab sends its own flowId; a mismatched shared cookie is rejected
        before Identity dispatch. Proof, internal IDs and passwords are never stored
        in JS storage or returned. Completion never changes a Ready credential; credentialOutcome
        ExistingWinner requires independent sign-in with the winning password.
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/FetchSite'
      security:
      - antiforgeryCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationStartRequest'
            examples: {}
      responses:
        '400':
          $ref: '#/components/responses/RegistrationValidation400'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/RegistrationConflict409'
        '413':
          $ref: '#/components/responses/TooLargeError'
        '415':
          $ref: '#/components/responses/MediaTypeError'
        '429':
          $ref: '#/components/responses/RegistrationRate429'
        '503':
          $ref: '#/components/responses/CsrfUnavailable503'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/RouterFallback'
        '202':
          description: Explicit private registration result. Never sets an authentication
            session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPending'
              examples: {}
          x-cookie-actions:
            __Host-smartcore-registration: set
  /bff/register/verify:
