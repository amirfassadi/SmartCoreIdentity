openapi: 3.1.0
info:
  title: SmartCore development authentication subset
  version: 0.4.0
  description: Development BFF adapter. Authenticated BFF supplies a stable opaque
    X-Bff-Subject for separate distributed admission budgets. Password change is separately
    opt-in. Operator recovery HTTP is available only over a private Unix domain socket,
    never on the application TCP listener. No reset endpoint. Recovery enrollment
    and reset initiation are separately opt-in. Reset completion is not implemented.
paths:
  /auth/login:
    post:
      security:
      - bffKey: []
      responses:
        '200':
          description: Committed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AUTHENTICATION_BUSY when the bounded KDF queue is full or its
            two-second wait expires; TEMPORARILY_UNAVAILABLE for dependency failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
  /auth/refresh:
    post:
      security:
      - bffKey: []
      responses:
        '200':
          description: Committed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
  /auth/logout:
    post:
      security:
      - bffKey: []
        bearer: []
      responses:
        '204':
          description: Closed or bound terminal replay
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
  /me:
    get:
      security:
      - bffKey: []
        bearer: []
      responses:
        '200':
          description: Committed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
  /auth/password/change:
    post:
      security:
      - bffKey: []
        bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '202':
          description: Durable workflow status; Reconciled may mean Applied or RejectedNotApplied,
            not a password-success assertion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeStatus'
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AUTHENTICATION_BUSY when the bounded KDF queue is full or its
            two-second wait expires; TEMPORARILY_UNAVAILABLE for dependency failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
  /dev/auth/recovery/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      security:
      - operatorKey: []
      responses:
        '200':
          description: Durable workflow status; Reconciled may mean Applied or RejectedNotApplied,
            not a password-success assertion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeStatus'
        '404':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      security:
      - operatorKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recovery'
      responses:
        '200':
          description: Durable workflow status; Reconciled may mean Applied or RejectedNotApplied,
            not a password-success assertion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeStatus'
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    x-transport: private-unix-domain-socket
  /auth/recovery/enroll:
    post:
      security:
      - bffKey: []
        bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRecoveryCode'
      responses:
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Bound operation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AUTHENTICATION_BUSY when the bounded KDF queue is full or its
            two-second wait expires; TEMPORARILY_UNAVAILABLE for dependency failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Code is shown once on new enrollment; initiation is uniformly
            accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEnrollmentResult'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
  /auth/password/reset:
    post:
      security:
      - bffKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPasswordReset'
      responses:
        '400':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Uniform failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Bound operation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED caller or transport budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AUTHENTICATION_BUSY when the bounded KDF queue is full or its
            two-second wait expires; TEMPORARILY_UNAVAILABLE for dependency failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: Code is shown once on new enrollment; initiation is uniformly
            accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPending'
      parameters:
      - name: X-Bff-Subject
        in: header
        required: true
        description: Stable BFF-generated admission assertion; never copied from an
          untrusted browser header. This is not Person identity or authorization.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
components:
  schemas:
    Login:
      type: object
      additionalProperties: false
      properties:
        email: &id001
          type: string
        mobile: *id001
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      oneOf:
      - required:
        - email
        not:
          required:
          - mobile
      - required:
        - mobile
        not:
          required:
          - email
    Refresh:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          maxLength: 180
        foreground:
          type: boolean
      required:
      - refreshToken
      - foreground
    Logout:
      type: object
      additionalProperties: false
      properties:
        sessionId: &id002
          type: string
          format: uuid
      required:
      - sessionId
    Person:
      type: object
      additionalProperties: false
      properties:
        personId: *id002
        displayName: *id001
        email: *id001
        mobile: *id001
        status:
          const: Active
        recoveryEnrollmentRequired:
          type: boolean
          description: BFF must require one-time recovery enrollment before completing
            real-user onboarding; consumed-code enforcement follows reset completion.
      required:
      - personId
      - displayName
      - status
      - recoveryEnrollmentRequired
    Tokens:
      type: object
      additionalProperties: false
      properties:
        sessionId: *id002
        accessToken: *id001
        refreshToken: *id001
        expiresAt: &id003
          type: string
          format: date-time
        accessExpiresAt: *id003
      required:
      - sessionId
      - accessToken
      - refreshToken
      - expiresAt
      - accessExpiresAt
    LoginResult:
      type: object
      additionalProperties: false
      properties:
        person:
          $ref: '#/components/schemas/Person'
        session:
          $ref: '#/components/schemas/Tokens'
      required:
      - person
      - session
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code: *id001
            message: *id001
          required:
          - code
          - message
        traceId: *id001
      required:
      - error
      - traceId
    ChangePassword:
      type: object
      additionalProperties: false
      required:
      - operationId
      - currentPassword
      - newPassword
      properties:
        operationId:
          type: string
          format: uuid
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
    ChangeStatus:
      type: object
      additionalProperties: false
      required:
      - operationId
      - stage
      properties:
        operationId:
          type: string
          format: uuid
        stage:
          enum:
          - Fenced
          - AwaitingCredential
          - Reconciled
          - FailedClosed
    Recovery:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          enum:
          - Retry
          - ResolveNotApplied
    EnrollRecoveryCode:
      type: object
      additionalProperties: false
      required:
      - operationId
      - currentPassword
      - acceptLossRisk
      properties:
        operationId:
          type: string
          format: uuid
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        acceptLossRisk:
          const: true
    RecoveryEnrollmentResult:
      type: object
      additionalProperties: false
      required:
      - operationId
      - version
      - status
      properties:
        operationId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          enum:
          - Issued
          - AlreadyIssued
        recoveryCode:
          type: string
          pattern: ^[A-F0-9]{32}$
      oneOf:
      - properties:
          status:
            const: Issued
        required:
        - recoveryCode
      - properties:
          status:
            const: AlreadyIssued
        not:
          required:
          - recoveryCode
    StartPasswordReset:
      type: object
      additionalProperties: false
      required:
      - operationId
      - bindingSecret
      properties:
        operationId:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 254
        mobile:
          type: string
          pattern: ^\+[1-9][0-9]{1,14}$
        bindingSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      oneOf:
      - required:
        - email
        not:
          required:
          - mobile
      - required:
        - mobile
        not:
          required:
          - email
    ResetPending:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - expiresAt
      - status
      properties:
        challengeId:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          type: string
          format: date-time
        status:
          const: Accepted
  securitySchemes:
    bffKey:
      type: apiKey
      in: header
      name: X-Bff-Client-Key
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operatorKey:
      type: apiKey
      in: header
      name: X-Auth-Operator-Key
