components:
  schemas:
    StartRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        mobile:
          type: string
          pattern: ^\+[1-9][0-9]{1,14}$
        password:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        bindingSecret: &id002
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Base64url unpadded encoding of 32 random bytes.
      required:
      - password
      - displayName
      - bindingSecret
      additionalProperties: false
      oneOf:
      - required:
        - email
        not:
          required:
          - mobile
      - required:
        - mobile
        not:
          required:
          - email
    VerifyRegistration:
      type: object
      properties:
        verificationSessionId: *id001
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
        bindingSecret: *id002
      required:
      - verificationSessionId
      - code
      - bindingSecret
      additionalProperties: false
    ResendVerification:
      type: object
      properties:
        verificationSessionId: *id001
        bindingSecret: *id002
      required:
      - verificationSessionId
      - bindingSecret
      additionalProperties: false
    VerificationPending:
      type: object
      properties:
        verificationSessionId: *id001
        expiresAt: &id003
          type: string
          format: date-time
        status:
          const: AwaitingVerification
      required:
      - verificationSessionId
      - expiresAt
      - status
      additionalProperties: false
    Accepted:
      type: object
      properties:
        status:
          const: Accepted
      required:
      - status
      additionalProperties: false
    RegistrationResult:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        status:
          enum:
          - PendingCredential
          - Ready
        ownershipCommittedAt: *id003
        readyAt: *id003
      required:
      - registrationId
      - status
      - ownershipCommittedAt
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              const: Ready
        then:
          required:
          - readyAt
        else:
          not:
            required:
            - readyAt
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id004
              type: string
            message: *id004
            nextAction:
              enum:
              - RequestSetup
              - SignIn
          required:
          - code
          - message
          additionalProperties: false
        traceId: *id004
      required:
      - error
      - traceId
      additionalProperties: false
    SetupPending:
      type: object
      properties:
        setupChallengeId:
          type: string
          minLength: 32
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        status:
          const: Accepted
      required:
      - setupChallengeId
      - expiresAt
      - status
      additionalProperties: false
    CompleteRegistration:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
        bindingSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Base64url unpadded encoding of 32 random bytes.
        setupChallengeId:
          type: string
          minLength: 32
          maxLength: 128
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
      required:
      - setupChallengeId
      - code
      - bindingSecret
      - newPassword
      additionalProperties: false
    CompletionResult:
      type: object
      properties:
        registrationId:
          type: string
          format: uuid
        status:
          enum:
          - PendingCredential
          - Ready
        ownershipCommittedAt: &id005
          type: string
          format: date-time
        readyAt: *id005
        credentialOutcome:
          enum:
          - CandidateSelected
          - ExistingWinner
          - Undetermined
      required:
      - registrationId
      - status
      - ownershipCommittedAt
      - credentialOutcome
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              const: Ready
        then:
          required:
          - readyAt
          properties:
            credentialOutcome:
              enum:
              - CandidateSelected
              - ExistingWinner
        else:
          not:
            required:
            - readyAt
