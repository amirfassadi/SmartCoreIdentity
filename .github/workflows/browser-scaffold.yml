name: Browser B1 infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  next-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/identity/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
  two-host-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bff_test
          POSTGRES_PASSWORD: test_only_bff_password
          POSTGRES_DB: bff_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bff_test -d bff_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/SmartCore.Identity.Api --locked-mode
      - run: dotnet build src/SmartCore.Identity.Bff.Host -c Release -m:1
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/bff-host-smoke.py
        env:
          ConnectionStrings__Bff: Host=localhost;Database=bff_test;Username=bff_test;Password=test_only_bff_password
