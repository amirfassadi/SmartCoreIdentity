name: Registration backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-registration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smartcore_test
          POSTGRES_PASSWORD: test_only_ci_password
          POSTGRES_DB: smartcore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcore_test -d smartcore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/SmartCore.Identity.Api --locked-mode
      - run: dotnet build tests/SmartCore.Identity.Tests -c Release
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet run --project tests/SmartCore.Identity.Tests -c Release --no-build
        env:
          SMARTCORE_TEST_DB: Host=localhost;Database=smartcore_test;Username=smartcore_test;Password=test_only_ci_password
          SMARTCORE_TEST_ALLOW_RESET: 'yes'
          SMARTCORE_TEST_ENGINE: PostgreSQL 17
          SMARTCORE_EVENT_FIXTURES: /tmp/identity-events.json
      - run: python scripts/check-events.py /tmp/identity-events.json
      - run: dotnet build src/SmartCore.Identity.Api
      - run: python scripts/api-smoke.py
        env:
          ConnectionStrings__Identity: Host=localhost;Database=smartcore_test;Username=smartcore_test;Password=test_only_ci_password
      - run: python scripts/setup-smoke.py
        env:
          ConnectionStrings__Identity: Host=localhost;Database=smartcore_test;Username=smartcore_test;Password=test_only_ci_password
      - run: python scripts/auth-smoke.py
        env:
          ConnectionStrings__Identity: Host=localhost;Database=smartcore_test;Username=smartcore_test;Password=test_only_ci_password
      - run: python scripts/password-smoke.py
        env:
          ConnectionStrings__Identity: Host=localhost;Database=smartcore_test;Username=smartcore_test;Password=test_only_ci_password
