validation_status:
  structural: PASS
  semantic: PASS
  architectural: PASS
  governance: BLOCKED
  ai_readiness: PASS
  machine_consumability: PASS
  machine_consumability_note: >-
    Renamed/aliased from ai_readiness after this exact naming ambiguity was
    raised independently across three separate review rounds — "ai_readiness:
    PASS" next to "generation_readiness: BLOCKED" kept reading, in isolation,
    as if AI code generation were cleared. machine_consumability is the
    field a tool SHOULD check for "is this specification well-formed enough
    to reason about"; generation_readiness.status remains the ONLY field
    that gates actual code generation. ai_readiness is retained, set equal
    to machine_consumability, purely for backward compatibility with any
    tooling already reading the old key — it SHALL NOT be treated as a
    second, independent signal.
  ai_readiness_note: >-
    PASS here means "this specification is structurally/semantically
    well-formed enough for an AI system to consume and reason about" —
    it is a specification-quality judgment, not a generation-clearance
    judgment. It SHALL NOT be read in isolation as "cleared to generate
    code." The sole authoritative generation gate is
    generation_readiness.status above (and the mirrored value here),
    which remains BLOCKED pending ADR-0002/ADR-0003 acceptance.
  generation_readiness: BLOCKED
